const midPx = (pxMin + pxMax) / 2.0;

// mapping parameters
let baseMin = 0.90;     // default YH range
let baseMax = 1.80;
let flip = false;
let offset = 0.0;       // additive shift (µm)
let scale = 1.0;        // multiply dispersion
let nLines = 5;

const cnv = document.getElementById('canvas');
const ctx = cnv.getContext('2d');

function resizeCanvas() {
  cnv.width = cnv.clientWidth;
  cnv.height = cnv.clientHeight;
}
window.addEventListener('resize', () => { resizeCanvas(); draw(); });

function lamForPixel(px) {
  const disp = (baseMax - baseMin) / npx * scale;
  const sign = flip ? -1.0 : 1.0;
  // central pixel maps to (baseMin+baseMax)/2 + offset
  return ((baseMin + baseMax)/2.0) + offset + sign * disp * (px - midPx);
}
function computeLamRange() {
  const L0 = lamForPixel(pxMin), L1 = lamForPixel(pxMax);
  return [Math.min(L0,L1), Math.max(L0,L1)];
}
function pickTopNKr(n) {
  const filt = kr.filter(k => k.wl >= 0.90 && k.wl <= 1.80); // YH band only
  const sorted = filt.sort((a,b) => b.counts - a.counts);
  return sorted.slice(0, Math.min(n, sorted.length));
}

function drawAxes(xmin, xmax, ymin, ymax) {
  const W = cnv.width, H = cnv.height;

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,W,H);
  // grid
  ctx.strokeStyle = '#e5e5e5';
  ctx.lineWidth = 1;
  const nx = 8, ny = 4;
  for (let i=0;i<=nx;i++) { const x = i/nx * W; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }

  ctx.fillStyle = '#333';
  ctx.font = '12px system-ui, -apple-system, Segoe UI, Roboto, Arial';
