function resizeCanvas() {

function lamForPixel(px) {
  const disp = (baseMax - baseMin) / npx * scale;

  return ((baseMin + baseMax)/2.0) + offset + sign * disp * (px - midPx);

  offset = parseFloat(document.getElementById('offset').value);
  document.getElementById('offsetVal').innerText = offset.toFixed(3);

  scale = parseFloat(document.getElementById('scale').value);
  document.getElementById('scaleVal').innerText = scale.toFixed(3);

  flip = document.getElementById('flip').checked;
  draw();
}
document.getElementById('nLines').addEventListener('input', updateFromControls);
document.getElementById('offset').addEventListener('input', updateFromControls);
document.getElementById('scale').addEventListener('input', updateFromControls);
document.getElementById('flip').addEventListener('change', updateFromControls);

// Presets
document.getElementById('presetJK').addEventListener('click', () => {
  baseMin = 1.20; baseMax = 2.40;  // updated
  document.getElementById('scale').value = 1.000;
  document.getElementById('offset').value = 0.000;
  document.getElementById('flip').checked = false;
  updateFromControls();
});
document.getElementById('presetH').addEventListener('click', () => {
  baseMin = 1.4968625; baseMax = 1.5080795;
  document.getElementById('scale').value = 1.000;
  document.getElementById('offset').value = 0.000;
  document.getElementById('flip').checked = false;
  updateFromControls();
});

// initial draw
updateFromControls();
</script>
